<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Work | Bowen Shaw</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Animated background -->
    <div class="background">

        <div class="moon"></div>

        <div class="mountain mountain-back"></div>
        <div class="mountain mountain-front"></div>

        <div class="torii">
            <div class="torii-top"></div>
            <div class="torii-middle"></div>
            <div class="torii-post left"></div>
            <div class="torii-post right"></div>
        </div>

        <div class="water"></div>

    </div>


    <!-- Falling petals -->
    <div id="petals" aria-hidden="true"></div>


    <!-- Navigation -->
    <nav class="navbar">

        <a href="index.html" class="logo">
            武 <span>BOWEN</span>
        </a>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About Me
            </a>

            <a class="active" href="work.html">
                My Work
            </a>

        </div>

        <div class="nav-buttons">

            <button id="petalButton" title="Toggle petals">
                🌸
            </button>

            <button id="themeButton" title="Toggle theme">
                ☾
            </button>

        </div>

    </nav>


    <main class="page-shell">

        <p class="eyebrow">
            
        </p>

        <h1>
            My <span>Work</span>
        </h1>


        <section class="work-grid">


            <article class="work-card">

                <div class="work-number">
                    01
                </div>

                <div class="work-icon">
                    刀
                </div>

                <h2>
                    Creative Website
                </h2>

                <p>
                    A creative project that lets me experiment with design and code.
                </p>

                <button class="copy-button" data-copy="Creative Website">
                    Copy Project Name
                </button>

            </article>


            <article class="work-card">

                <div class="work-number">
                    02
                </div>

                <div class="work-icon">
                    龍
                </div>

                <h2>
                    Interactive Project
                </h2>

                <p>
                    Something interactive that combines what I learn with my own style.
                </p>

                <button class="copy-button" data-copy="Interactive Project">
                    Copy Project Name
                </button>

            </article>


            <article class="work-card">

                <div class="work-number">
                    03
                </div>

                <div class="work-icon">
                    桜
                </div>

                <h2>
                    Final Project
                </h2>

                <p>
                    A final project I can look back on and be proud of.
                </p>

                <button class="copy-button" data-copy="Final Project">
                    Copy Project Name
                </button>

            </article>


        </section>

    </main>


    <button id="topButton" title="Back to top">
        ↑
    </button>


    <script src="js/script.js"></script>
